<div class="min-h-screen bg-brand-surface p-8">
  <!-- Header Section -->
  <div class="flex flex-wrap items-center justify-between gap-6 bg-white rounded-3xl shadow-xl shadow-deep/5 border border-deep/5 p-8 mb-8">
    <div>
      <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-deep/40 mb-2">Management Console</div>
      <h1 class="text-3xl font-bold text-deep tracking-tight">Enterprise Logos</h1>
      <div class="flex items-center gap-4 mt-2">
        <button (click)="goToDashboard()" class="text-xs font-bold text-accent uppercase tracking-widest hover:text-deep transition-colors flex items-center gap-2">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Back to Dashboard
        </button>
        <span class="w-1 h-1 bg-deep/10 rounded-full"></span>
        <span class="text-xs font-medium text-deep/40">{{ logos.length }} logos managed</span>
      </div>
    </div>
    <div class="flex gap-3">
      <button (click)="logout()" class="bg-white text-red-600 border border-red-100 px-6 py-3 rounded-xl font-bold text-sm hover:bg-red-50 transition-all flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Alert Messages -->
  <div class="flex flex-col gap-3 mb-6">
    <div *ngIf="successMessage" class="p-4 bg-green-50 text-green-700 rounded-xl border border-green-100 font-bold text-sm">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="p-4 bg-red-50 text-red-700 rounded-xl border border-red-100 font-bold text-sm">
      {{ errorMessage }}
    </div>
  </div>

  <div class="p-6">

  <!-- Form Section -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
    <form [formGroup]="logoForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Enterprise Name</label>
        <input type="text" formControlName="name" class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-accent/50 outline-none" placeholder="e.g. Swiggy">
      </div>
      <div class="col-span-1">
        <app-image-upload formControlName="logoUrl" label="Enterprise Logo" [preview]="true"></app-image-upload>
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Order</label>
          <input type="number" formControlName="displayOrder" class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-accent/50 outline-none">
        </div>
        <div class="flex gap-2 items-end">
          <button type="submit" [disabled]="logoForm.invalid || loading" class="px-6 py-2 bg-black text-white rounded-lg hover:bg-gray-800 transition-colors disabled:opacity-50">
            {{ isEditing ? 'Update' : 'Add' }}
          </button>
          <button *ngIf="isEditing" type="button" (click)="resetForm()" class="px-6 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-colors">
            Cancel
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Table Section -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr>
            <th class="px-6 py-4 text-sm font-semibold text-gray-600">Logo</th>
            <th class="px-6 py-4 text-sm font-semibold text-gray-600">Name</th>
            <th class="px-6 py-4 text-sm font-semibold text-gray-600">Sort Order</th>
            <th class="px-6 py-4 text-sm font-semibold text-gray-600 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let logo of logos" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4">
              <img [src]="logo.logoUrl" [alt]="logo.name" class="h-8 w-auto object-contain">
            </td>
            <td class="px-6 py-4 font-medium text-gray-800">{{ logo.name }}</td>
            <td class="px-6 py-4 text-gray-500">{{ logo.displayOrder || 0 }}</td>
            <td class="px-6 py-4 text-right">
              <div class="flex justify-end gap-2">
                <button (click)="editLogo(logo)" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Edit">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button (click)="deleteLogo(logo.id)" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="logos.length === 0 && !loading">
            <td colspan="4" class="px-6 py-8 text-center text-gray-500">No logos found</td>
          </tr>
          <tr *ngIf="loading">
            <td colspan="4" class="px-6 py-8 text-center text-gray-500">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

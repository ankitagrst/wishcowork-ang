<div class="flex flex-wrap items-center justify-between gap-6 bg-white rounded-3xl shadow-xl shadow-deep/5 border border-deep/5 p-8 mb-8">
  <div>
    <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-deep/40 mb-2">Management Console</div>
    <h1 class="text-3xl font-bold text-deep tracking-tight">{{ title }}</h1>
    <p *ngIf="subtitle" class="text-sm font-medium text-deep/40 mt-1">{{ subtitle }}</p>
  </div>
  <div class="flex gap-3" *ngIf="showView || showLogout">
    <button *ngIf="showView" (click)="viewWebsite()" class="bg-white text-deep border border-deep/10 px-6 py-3 rounded-xl font-bold text-sm hover:bg-sand transition-all flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>View Website</span>
    </button>
    <button *ngIf="showLogout" (click)="logout()" class="bg-white text-red-600 border border-red-100 px-6 py-3 rounded-xl font-bold text-sm hover:bg-red-50 transition-all flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      <span>Logout</span>
    </button>
  </div>
</div>

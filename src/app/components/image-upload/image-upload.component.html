<div class="space-y-4">
  <div class="flex items-center justify-between" *ngIf="label">
    <span class="text-[10px] font-bold uppercase tracking-widest text-deep/40 ml-1">{{ label }}</span>
    <button *ngIf="imageUrl" type="button" (click)="removeImage()" class="text-[10px] font-bold text-red-500 hover:text-red-700 uppercase tracking-widest transition-colors">Remove</button>
  </div>
  
  <div 
    class="relative group cursor-pointer" 
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    [class.opacity-50]="isUploading"
  >
    <!-- Preview Area -->
    <div *ngIf="imageUrl && preview" class="relative rounded-2xl overflow-hidden aspect-video border border-deep/10 bg-white shadow-inner flex items-center justify-center p-4" (click)="fileInput.click()">
      <img [src]="imageUrl" class="max-w-full max-h-full object-contain transition-transform duration-500 group-hover:scale-105" alt="Preview">
      <div class="absolute inset-0 bg-deep/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
        <span class="text-white text-[10px] font-bold uppercase tracking-widest px-4 py-2 border border-white/30 rounded-lg backdrop-blur-sm">Change Image</span>
      </div>
    </div>

    <!-- Upload Placeholder -->
    <div *ngIf="(!imageUrl || !preview) && !isUploading" (click)="fileInput.click()" class="border-2 border-dashed border-deep/10 rounded-2xl p-8 flex flex-col items-center justify-center transition-all hover:border-accent hover:bg-accent/[0.02]">
      <div class="w-12 h-12 bg-sand rounded-xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
        <svg class="w-6 h-6 text-deep/40 group-hover:text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </div>
      <p class="text-sm font-bold text-deep/60 mb-1">Click or drag image</p>
      <p class="text-[10px] text-deep/30 uppercase tracking-widest font-bold">Max 5MB</p>
    </div>

    <!-- Uploading Overlay -->
    <div *ngIf="isUploading" class="border-2 border-dashed border-accent/20 rounded-2xl p-8 flex flex-col items-center justify-center bg-sand/20">
      <div class="w-8 h-8 border-4 border-accent border-t-transparent rounded-full animate-spin mb-4"></div>
      <span class="text-[10px] font-bold text-deep uppercase tracking-widest animate-pulse">Uploading Media...</span>
    </div>
  </div>

  <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden">
  
  <!-- Error Message -->
  <div *ngIf="error" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center gap-2 border border-red-100">
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    {{ error }}
  </div>
</div>
